name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Install Android API 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify Android project and unit tests
        run: gradle --no-daemon testDebugUnitTest assembleDebug lintDebug
      - name: Verify APK package and launchable activity
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > /tmp/droni-badging.txt
          grep -F "package: name='at.droni'" /tmp/droni-badging.txt
          grep -F "launchable-activity: name='at.droni.MainActivity'" /tmp/droni-badging.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: droni-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
